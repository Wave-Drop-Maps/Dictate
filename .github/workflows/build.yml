name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Cache only package sources. Binary artifacts (XCFrameworks) and build products are
      # always fetched/built fresh, so a stale or partial cache can't break the build.
      - name: Cache Swift package sources
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-sources-v2-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-sources-v2-${{ runner.os }}-

      - name: Build
        run: swift build -c release --product SpeakFn

      - name: Package app bundle
        run: |
          APP=build/SpeakFn.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/SpeakFn "$APP/Contents/MacOS/"
          cp Info.plist "$APP/Contents/"
          cp icon/SpeakFn.icns sounds/*.wav "$APP/Contents/Resources/"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
